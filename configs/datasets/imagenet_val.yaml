# ImageNet-1k **validation only**, for the single external reference number in
# the spec (§0.5 / §11 check 1: CLIP-L linear probe ~85%).
#
# Source is clip-benchmark/wds_imagenet1k rather than ILSVRC/imagenet-1k, which
# is gated. Same 50k images.
#
# NOTE the deviation this forces, and state it wherever the number is quoted:
# Zhang et al.'s 85.2% is a probe trained on the ImageNet *train* split. Here
# both probe-train and probe-test come out of val (40/10 per class), so this is a
# lower-data proxy and should land somewhat *below* 85%, not on it. It still does
# the job it is here for — validating the probe trainer and the encoder path
# before anything past the projector is trusted. Phase 3 replaces it.
name: imagenet_val
granularity: coarse
num_classes: 1000
train_size: 40000     # 40/class carved out of val
test_size: 10000      # 10/class
root: imagenet_val
probe_split_per_class: 40

# NOTE: no `templates` key here, so src.evaluate_generative falls back to the
# single "a photo of a {}." prompt. Spec §6.1 asks for the 80-prompt OpenAI
# ensemble on ImageNet. The measured 75.19% zero-shot is therefore a
# single-template number, not an ensembled one, and sits ~1.4 points below the
# published ensembled 76.6% for CLIP-L/14-336 — which is the expected size of
# that gap, not a bug. Add the 80 prompts here before quoting this figure
# against ensembled numbers from the literature.
